<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTest - AFRAME + AR.js</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="./assets/components/ges-detector.js"></script>
    <script src="./assets/components/ges-handler.js"></script>
</head>
<body style="margin : 0px; overflow: hidden;">
    <a-scene 
        embedded 
        arjs
        xr-modde-ui="enabled: false; "
        ges-detector
        id="scene"
    >
        <a-assets>
            <a-asset-item id="dice-gltf" src="./assets/models/dice.glb"></a-asset-item>
            <img id="test-image" src="./assets/images/test.png" alt="Test Image">
        </a-assets>
        <a-entity light="type:directional; castShadow:true;" position="1 1 1"></a-entity>
        <a-marker type="pattern" url="./assets/patterns/url-pattern.patt">^
            <a-gltf-model ges-handler
                class="collidable"
                src="#dice-gltf"
                roration="0 0 0"
                shadow="recieve:false;"
            ></a-gltf-model>
        </a-marker>
        <a-marker preset="hiro">
            <a-plane src="#test-image" width="1" height="1" rotation="0 0 0"></a-plane>
            <!-- <a-image src="#test-image" width="1" height="1"></a-image> -->
        </a-marker>
        <a-entity raycaster="objects: .collidable; showLine: true;"></a-entity>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
