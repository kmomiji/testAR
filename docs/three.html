<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ARTestPage - Three.js AR</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from "three/webgpu";

        const renderer = new THREE.WebGPURenderer({
            canvas: document.querySelector("#cv"),
        });

        const WIDTH = 960;
        const HEIGHT = 540;
        const FOV = 45;

        // キャンバス設定
        renderer.setSize(WIDTH, HEIGHT);
        renderer.setPixelRatio(devicePixelRatio);
        // アニメーション登録
        renderer.setAnimationLoop(tick);
        // 影を有効化
        renderer.shadowMap.enabled = true;


        // シーン作成
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // カメラ
        const camera = new THREE.PerspectiveCamera(FOV, WIDTH/HEIGHT);
        camera.position.set(20,20,20);
        camera.lookAt(new THREE.Vector3(0,0,0));

        // 床オブジェクトを作成
        const meshFloor = new THREE.Mesh(
            new THREE.BoxGeometry(2000, 0.1, 2000),
            new THREE.MeshStandardMaterial({ color: 0x800000, roughness: 0.0})
        );
        // 床オブジェクトは影を受けるようにする
        meshFloor.recieveShadow = true;
        scene.add(meshFloor);

        // オブジェクト作成(Torus)
        const meshObj = new THREE.Mesh(
            new THREE.TorusKnotGeometry(3, 1, 100, 16),
            new THREE.MeshStandardMaterial({color: 0xaa0000, roughness: 0.0})
        );
        // 影を落とせるようにする
        meshObj.position.set(0,5,0);
        meshObj.castShadow = true;
        // オブジェクトをシーンに追加
        scene.add(meshObj);

        // 光源
        const light = new THREE.SpotLight(0xffffff, 400, 100, Math.PI / 4, 1);
        // ライトの影を有効化する
        light.castShadow = true;
        light.shadow.mapSize.width = 2048;
        light.shadow.mapSize.height = 2048;
        scene.add(light);



        function tick(){
            // アニメーション
            renderer.render(scene, camera);

            // 照明を回す
            const t = Date.now() / 500;
            const r = 20.0;
            const lx = r * Math.sin(t);
            const lz = r * Math.cos(t);
            const ly = 20.0 + 5.0 * Math.sin(t / 3.0);
            light.position.set(lx, ly, lz);

        }

    </script>
</head>
<body>
    <canvas id="cv"></canvas>
</body>
</html>
