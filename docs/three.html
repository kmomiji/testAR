<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTestPage - Three.js AR</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from "three/webgpu";

        const renderer = new THREE.WebGPURenderer({
            canvas: document.querySelector("#cv")
        });

        renderer.setSize(960, 540);
        renderer.setPixelRatio(devicePixelRatio);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(45, 960/540);
        const boxGeo = new THREE.BoxGeometry(500,500,500);

        const boxMat = new THREE.MeshToonMaterial({color: 0xFF0000});
        const box = new THREE.Mesh(boxGeo, boxMat);

        scene.add(box); 

        renderer.setAnimationLoop(tick);

        function tick(){
            // アニメーション
            box.rotation.y += 0.01;
            renderer.render(scene, camera);
        }

    </script>
</head>
<body>
    <canvas id="cv"></canvas>
</body>
</html>
