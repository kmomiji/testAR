<html>
<head>
    <meta charset="UTF-8">
    <title>ARTestPage - Three.js AR</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from "three/webgpu";

        const renderer = new THREE.WebGPURenderer({
            canvas: document.querySelector("#cv"),
        });

        const WIDTH = 960;
        const HEIGHT = 540;
        const FOV = 45;

        // キャンバス設定
        renderer.setSize(WIDTH, HEIGHT);
        // アニメーション登録
        renderer.setAnimationLoop(tick);


        // シーン作成
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // カメラ
        const camera = new THREE.PerspectiveCamera(FOV, WIDTH/HEIGHT);
        camera.position.set(0,0,+1000);

        // オブジェクト作成(box)
        const sphereGeo = new THREE.SphereGeometry(300,30,30);
        const sphereMat = new THREE.MeshStandardMaterial({color: 0xFF0000});
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);

        // オブジェクトをシーンに追加
        scene.add(sphere); 

        // 方向光源
        const dirLight = new THREE.DirectionalLight(0xffffff);
        dirLight.position.set(1,1,1);


        function tick(){
            // アニメーション
            renderer.render(scene, camera);
        }

    </script>
</head>
<body>
    <canvas id="cv"></canvas>
</body>
</html>
